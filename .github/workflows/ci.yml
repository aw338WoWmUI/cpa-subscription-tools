name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    container: golang:1.26-bookworm
    steps:
      - uses: actions/checkout@v4
      - run: apt-get update && apt-get install -y --no-install-recommends python3 zip
      - run: make test build
      - uses: actions/checkout@v4
        with:
          repository: router-for-me/CLIProxyAPI
          ref: 5be2cdab0869cbaa3d401891f740aebf7e15aa99
          path: upstream-host
      - run: go build -o /tmp/cpa-host ./cmd/server
        working-directory: upstream-host
      - run: python3 scripts/integration.py --host /tmp/cpa-host --library dist/linux/amd64/cpa-subscription-tools.so
      - name: Package
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          if [[ "$GITHUB_REF_TYPE" != tag ]]; then version=0.1.0; fi
          asset="cpa-subscription-tools_${version}_linux_amd64.zip"
          cd dist/linux/amd64
          zip "$asset" cpa-subscription-tools.so
          sha256sum "$asset" > checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/linux/amd64/*.zip
            dist/linux/amd64/checksums.txt
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-release
          path: release
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip release/checksums.txt --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes 'Native credential import, Copilot quota, explicit manual Reset Bank, and safe Quota Pacer field updates. Linux amd64, Debian 12 or newer; tested with unmodified CLIProxyAPI v8.0.30.'
