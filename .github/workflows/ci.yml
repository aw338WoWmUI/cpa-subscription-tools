name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  platform:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, goos: linux, goarch: amd64, ext: so, container: 'golang:1.26-bookworm', python: python3}
          - {runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, ext: so, container: 'golang:1.26-bookworm', python: python3}
          - {runner: macos-15-intel, goos: darwin, goarch: amd64, ext: dylib, container: '', python: python3}
          - {runner: macos-15, goos: darwin, goarch: arm64, ext: dylib, container: '', python: python3}
          - {runner: windows-2022, goos: windows, goarch: amd64, ext: dll, container: '', python: python}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    defaults:
      run:
        shell: bash
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - if: matrix.goos == 'linux'
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - if: matrix.goos != 'linux'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - if: matrix.goos == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - if: matrix.goos == 'windows'
        run: echo 'C:/msys64/mingw64/bin' >> "$GITHUB_PATH"
      - name: Version
        run: |
          version=0.1.1
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then version=${GITHUB_REF_NAME#v}; fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Test and build
        run: |
          go test -race ./...
          go vet ./...
          mkdir -p "dist/$GOOS/$GOARCH"
          go build -buildvcs=false -trimpath -buildmode=c-shared -ldflags "-s -w -X main.version=$RELEASE_VERSION" -o "dist/$GOOS/$GOARCH/cpa-subscription-tools.${{ matrix.ext }}" .
      - uses: actions/checkout@v4
        with:
          repository: router-for-me/CLIProxyAPI
          ref: 5be2cdab0869cbaa3d401891f740aebf7e15aa99
          path: upstream-host
      - run: go build -buildvcs=false -o cpa-host.exe ./cmd/server
        working-directory: upstream-host
      - name: Native host integration
        run: ${{ matrix.python }} scripts/integration.py --host upstream-host/cpa-host.exe --library "dist/$GOOS/$GOARCH/cpa-subscription-tools.${{ matrix.ext }}"
      - name: Package
        run: ${{ matrix.python }} scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          path: release/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: platform
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Verify all platforms
        working-directory: release
        run: |
          test "$(find . -name '*.zip' | wc -l)" -eq 5
          cat ./*.sha256 > checksums.txt
          sha256sum --check checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip release/checksums.txt --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes 'Add macOS amd64/arm64, Linux arm64 and Windows amd64 alongside Linux amd64. Every archive passes race tests and native integration against unmodified CLIProxyAPI v8.0.30 on its own platform. Linux binaries target Debian 12/glibc. Management behavior is unchanged.'
