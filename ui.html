<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Subscription Tools · 订阅工具</title>
<style>body{font:16px system-ui;background:#11151b;color:#edf0f4;max-width:960px;margin:32px auto;padding:0 20px}section{border:1px solid #35404d;padding:20px;margin:20px 0;border-radius:12px}input,select,textarea,button{font:inherit;padding:10px;border-radius:6px;border:1px solid #526077;background:#1a2330;color:inherit}textarea{box-sizing:border-box;width:100%;min-height:160px}button{cursor:pointer;margin:8px 8px 8px 0}button:disabled{opacity:.5}label{display:block;margin:12px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#b8ddc5}.muted{color:#aab4c2}h1{margin-bottom:8px}td{padding:8px;border-bottom:1px solid #35404d}table{width:100%;font-size:14px}</style>
<h1>Subscription Tools</h1><p class="muted">订阅导入 · Copilot 额度 · 手动 Reset Bank · 额度配速</p>
<section><h2>连接管理接口</h2><label>管理密钥 <input id="key" type="password" autocomplete="off"></label><button id="connect">连接</button><p class="muted">密钥仅保留在当前页面内存中。关闭页面后清除。</p><pre id="connection" role="status"></pre></section>
<section><h2>导入 Claude / Codex 订阅</h2><label>提供商 <select id="provider"><option value="claude">Claude Code</option><option value="codex">Codex</option></select></label><label>订阅 JSON <textarea id="credential" spellcheck="false" autocomplete="off"></textarea></label><button id="preview">预览</button><button id="import">确认导入</button><pre id="importResult" role="status"></pre></section>
<section><h2>账号与额度</h2><button id="refresh">刷新账号</button><label>Codex 账号 <select id="codex"></select></label><button id="credits">查看 Reset 机会</button><div id="creditRows"></div><label>Copilot 账号 <select id="copilot"></select></label><button id="copilotQuota">查看 Copilot 额度</button><pre id="quotaResult" role="status"></pre><p class="muted">仅在点击 Reset 并再次确认后兑换一次机会。没有自动兑换任务。</p></section>
<section><h2>原生路由与会话亲和性</h2><button id="loadRouting">读取配置</button><label>策略 <select id="strategy"><option value="weighted-round-robin">加权轮询</option><option value="round-robin">普通轮询</option><option value="fill-first">优先填满</option></select></label><label><input id="affinity" type="checkbox"> 启用会话亲和性</label><label>保留时间 <input id="ttl" value="24h"></label><button id="saveRouting">保存路由</button><pre id="routingResult" role="status"></pre></section>
<section><h2>Quota Pacer 配速</h2><button id="pacing">查看状态</button><button id="run">检查并应用</button><pre id="pacingResult" role="status"></pre></section>
<script>
const base='/v0/management/plugins/cpa-subscription-tools', el=id=>document.getElementById(id);
let key='';
async function api(path,method='GET',body){const r=await fetch(base+path,{method,cache:'no-store',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败：'+r.status);return d}
function show(id,data){el(id).textContent=typeof data==='string'?data:JSON.stringify(data,null,2)}
function action(id,out,fn){el(id).onclick=async()=>{el(id).disabled=true;try{await fn()}catch(e){show(out,e.message)}finally{el(id).disabled=false}}}
async function accounts(){const d=await api('/accounts');for(const type of ['codex','copilot']){el(type).replaceChildren();for(const a of d.files.filter(a=>a.provider===type&&!a.disabled)){const o=document.createElement('option');o.value=a.auth_index;o.textContent=a.name||a.auth_index;el(type).append(o)}}show('connection','已连接 · '+d.files.length+' 个账号')}
action('connect','connection',async()=>{key=el('key').value;el('key').value='';await accounts()});
function importBody(){return {provider:el('provider').value,content:JSON.parse(el('credential').value)}}
action('preview','importResult',async()=>show('importResult',await api('/import/preview','POST',importBody())));
action('import','importResult',async()=>{const body=importBody();await api('/import/preview','POST',body);if(!confirm('确认新增此订阅？已有凭据不会被覆盖。'))return;show('importResult',await api('/import','POST',{...body,confirm:true}));el('credential').value='';await accounts()});
action('refresh','connection',accounts);
async function credits(){const index=el('codex').value;if(!index)throw Error('请先选择 Codex 账号');const d=await api('/credits?auth_index='+encodeURIComponent(index));el('creditRows').replaceChildren();const p=document.createElement('p');p.textContent='可用机会：'+d.available_count;el('creditRows').append(p);for(const c of d.credits||[]){const row=document.createElement('p');row.textContent=(c.status||'未知状态')+' · 到期 '+(c.expires_at||'未知');if(c.status==='available'&&c.reset_type==='codex_rate_limits'&&Date.parse(c.expires_at)>Date.now()){const b=document.createElement('button');b.textContent='Reset 一次';let bytes=crypto.getRandomValues(new Uint8Array(16));bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;let hex=Array.from(bytes,x=>x.toString(16).padStart(2,'0')).join('');let requestID=hex.slice(0,8)+'-'+hex.slice(8,12)+'-'+hex.slice(12,16)+'-'+hex.slice(16,20)+'-'+hex.slice(20);b.onclick=async()=>{if(el('codex').value!==index){show('quotaResult','账号已切换，请重新读取机会。');return;}if(!confirm('这会消耗账号 '+el('codex').selectedOptions[0].textContent+' 的一次 Reset 机会，确认继续？'))return;b.disabled=true;try{await api('/reset','POST',{auth_index:index,credit_id:c.id,request_id:requestID,confirm:true});show('quotaResult','已提交一次 Reset，请核对刷新后的机会与额度。');await credits()}catch(e){show('quotaResult',e.message+'；请先刷新机会，重试会复用相同请求 ID。');b.disabled=false}};row.append(b)}el('creditRows').append(row)}}
el('codex').onchange=()=>{el('creditRows').replaceChildren();show('quotaResult','请重新读取此账号的 Reset 机会。')};
action('credits','quotaResult',credits);
action('copilotQuota','quotaResult',async()=>show('quotaResult',await api('/copilot-quota?auth_index='+encodeURIComponent(el('copilot').value))));
action('loadRouting','routingResult',async()=>{const d=await api('/routing');el('strategy').value=d.strategy;el('affinity').checked=d['session-affinity'];el('ttl').value=d['session-affinity-ttl']||'24h';show('routingResult',d)});
action('saveRouting','routingResult',async()=>show('routingResult',await api('/routing','PATCH',{strategy:el('strategy').value,'session-affinity':el('affinity').checked,'session-affinity-ttl':el('ttl').value})));
action('pacing','pacingResult',async()=>show('pacingResult',await api('/pacing')));
action('run','pacingResult',async()=>show('pacingResult',await api('/pacing/run','POST',{})));
</script></html>
